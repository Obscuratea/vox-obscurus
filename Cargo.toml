[package]
name = "vox-obscurus"
version = "0.3.2"
edition = "2024"

[dependencies]
cxx = "1.0.205"
cxx-qt = "0.10"
flacenc = "0.5.1"
ogg = "0.9.2"
opus = "0.4.0"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
pipewire = { version = "0.10", features = ["v0_3_77"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
zbus = "5"

[build-dependencies]
cxx-qt-build = "0.10"
cc = "1"
